[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ai"
version = "0.1.0"
description = "Open source AI coding harness and CLI for open weight models (GLM 5.2 & Kimi K2.5)"
readme = "README.md"
authors = [
    { name = "Forge Core Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
colab = [
    "psutil>=5.9.0",
    "huggingface_hub>=0.20.0",
]

[project.scripts]
forge = "forge.cli.main:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
